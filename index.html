<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunting phone Api</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header>
        <h1 class="text-6xl text-center mb-10 bg-red-300 rounded-2xl p-4">Hunting Phone</h1>
    </header>
    <main>
        <!-- search input filed -->
        <section class="bg-gray-100 p-5 ">
            <input id="inputFiledText" type="text" placeholder="Search here" class="input" />
            <button onclick="SearchPhone()" class="bg-blue-300 btn ">Search</button>
        </section>


        <!-- show search result -->

        <section>
            <!-- loadind or showing result that symbol show -->
            <div id="loading-spinner" class="text-center mt-10 mb-10 hidden">
                <span class="loading loading-spinner text-success  "></span>
            </div>
            <!-- no data fond -->
             <div id="dataNotFoundHereID" class="hidden">
                
             </div>
            <div id="phone-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                <!-- <div class="card bg-base-100 w-96 shadow-sm">
                    
                </div> -->
            </div>
            <div id="show-all-result" class="hidden text-center m-5">
                <button onclick="HandleShowAll()" class="btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">show
                    All</button>
            </div>
            <div id="show-all-result">

            </div>
        </section>


        <!-- show details modal -->
        <section>
            <!-- Open the modal using ID.showModal() method -->
            
            <dialog id="show_details_modal" class="modal modal-bottom sm:modal-middle">
                <div class="modal-box">
                    <div id="show-deatils_phone_image">

                    </div>
                    <h3 id="show-deatils_phone_name" class="font-bold text-lg"></h3>
                    <p id="show-deatils_phone_storage"></p>
                    <p id="show-deatils_phone_displaySize"></p>
                    <p id="show-deatils_phone_releaseDate"></p>
                    <p id=""></p>
                    <p id=""></p>
                    
                    <div class="modal-action">
                        <form method="dialog">
                            <!-- if there is a button in form, it will close the modal -->
                            <button class="btn">Close</button>
                        </form>
                    </div>
                </div>
            </dialog>
        </section>

    </main>
    <footer>

    </footer>

    <script src="js/phone.js"></script>

</body>

</html>
